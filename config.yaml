workers: 8
sample_size: 10000

# Selects which entry under `embeddings:` is active for this pipeline run.
# The active config is also used as the `config=` hive-partition value under
# output/TCAC_2.0/embeddings/, so different models live side-by-side on disk.
active_embedding: SPECTER2_runpod

embeddings:

  SPECTER2:
    # TEI server (start via ./scripts/start_tei_specter2.sh)
    host: localhost
    port: 8080
    scheme: http               # http for local, https for RunPod
    # auth_token_keyring: API_TEI   # OPTIONAL keyring entry → OVC_API_TOKEN (RunPod)
    model: allenai/specter2_proximity_merged   # provenance label (TEI --served-model-name)
    # Embedding-side tuning
    batch_size: 5000           # rows per shard (Arrow scan + parquet write)
    max_batch_size: 64        # texts per HTTP request to TEI (needs matching --max-client-batch-size 128 on TEI)
    concurrency: 1             # parallel in-flight HTTP requests; 1 = serial (local Metal default)
    # Text format
    sep_token: "[SEP]"
    title_cap_combined: 200    # char cap on title in `title [SEP] abstract` variant
    # Pilot
    pilot_n: 1000              # rows in the shared pilot subset (1000); null = full corpus
    # TEI server flags (read by scripts/start_tei_specter2.sh)
    max_batch_tokens: 32768
    max_concurrent: 512

  # RunPod-hosted TEI on a rented L40s/A100/H100. Flip active_embedding above and
  # populate host/auth before use. See scripts/start_tei_runpod.sh.
  SPECTER2_runpod:
    host: zinfjt034qan11-8080.proxy.runpod.net
    port: 443
    scheme: https
    # auth_token_keyring: API_TEI   # keyring::key_set("API_TEI") first
    model: allenai/specter2_proximity_merged
    batch_size: 7168
    max_batch_size: 256        # bigger client batch amortises ~30ms RTT
    concurrency: 14             # parallel in-flight HTTP requests — saturates the L40S via dynamic batching
    sep_token: "[SEP]"
    title_cap_combined: 200
    pilot_n: null
    # TEI-server-side flags (read by scripts/start_tei_runpod.sh on the pod):
    max_batch_tokens: 131072
    max_concurrent: 2048

  # Template for adding more models — uncomment, fill in, set active_embedding above.
  # NomicV1:
  #   host: localhost
  #   port: 8081
  #   model: nomic-ai/nomic-embed-text-v1.5
  #   batch_size: 5000
  #   max_batch_size: 64
  #   sep_token: ""             # Nomic uses raw concat, no special separator
  #   title_cap_combined: null  # 8192-ctx model — no need to cap title
  #   pilot_n: 1000
  #   max_batch_tokens: 65536
  #   max_concurrent: 512

# Cloudflare R2 (S3-compatible object storage). The BERTopic RunPod path
# reads embeddings directly from R2 via duckdb httpfs — no rsync upload.
# Credentials live in keyring (laptop) and RunPod Secrets (pod); only the
# non-secret addressing lives here.
#
# Path mapping: any local path under `embeddings_local_root` is translated
# to s3://<bucket>/<embeddings_remote_prefix>/<relative-from-local-root>
# by R/run_bertopic_runpod.R.
r2:
  endpoint:                26e6e95ff86cfcd155724000d2cdfbba.r2.cloudflarestorage.com
  bucket:                  tcac-2-0
  region:                  auto
  embeddings_local_root:   output/TCAC_2.0/embeddings
  embeddings_remote_prefix: embeddings
  # Credentials never live here. Laptop uses rclone's config; the pod
  # gets them as RunPod Secrets (template env vars):
  #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

# NEW: dual-path BERTopic. Each named entry under `configs:` produces its
# own (config, bertopic, variant) leaf under output/TCAC_2.0/topics/, so
# multiple runs coexist on disk for comparison. Add entries by appending
# under `configs:` and pointing one of the `active_*` keys at the new name.
bertopic:
  active_local:   default_local        # which entry drives topics_tcac20_local
  active_runpod:  default_runpod       # which entry drives topics_tcac20_runpod
  active_for_viz: default_local        # which run feeds viz_topics_* in the report

  configs:
    default_local:
      method: local
      sample_size: 200000              # rows to fit BERTopic on; transfer the rest
      umap_n_components: 5
      umap_n_neighbors:  15
      umap_min_dist:     0.0
      umap_metric:       cosine
      hdbscan_min_cluster_size: 15
      hdbscan_min_samples:      3
      top_n_words:        15
      keypaper_threshold:  3
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    default_runpod:
      method: runpod
      # SSH transport to the RunPod bertopic-runpod pod
      ssh_host:        194.68.245.80
      ssh_port:        22008
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      # BERTopic knobs scaled for full-corpus fit (~4.6M title_abstract rows
      # + 105 keypapers). See TD_BERTopic.md for the reasoning behind each
      # value.
      umap_n_components: 5
      umap_n_neighbors:  30                  # full-corpus density supports larger neighbourhood
      umap_min_dist:     0.0
      umap_metric:       cosine
      # 500 ≈ 0.01% of corpus → expect ~200–500 topics. Tune up if too many
      # micro-topics, tune down if signal is too coarse.
      hdbscan_min_cluster_size: 500
      hdbscan_min_samples:       50
      top_n_words:         15
      keypaper_threshold:   3                # 105 keypapers spread over ~200–500 topics
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2            # per-topic concat doc, not per-corpus doc
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

# DEPRECATED: original single-path BERTopic config. Kept temporarily so
# the existing topics_tcac20 target's command still parses while the embed
# pipeline is running. To be removed once _targets.R is rewired to use the
# bertopic: block (post-embed-run).
clustering:
  # UMAP for cluster space (separate from the 2D visualisation UMAP)
  umap_n_components: 5
  umap_n_neighbors:  15
  umap_min_dist:     0.0
  umap_metric:       cosine

  # HDBSCAN
  hdbscan_min_cluster_size: 10
  hdbscan_min_samples:      5

  # Topic representation
  top_n_words:        10        # for c-TF-IDF labels
  keypaper_threshold: 2         # topic is "relevant" if it contains ≥ N keypapers

  # Variant + fallback strategy
  primary_variant:  title_abstract
  fallback_variant: title       # null disables transfer; works without primary stay topic = -1

  # Reproducibility
  random_seed: 13
