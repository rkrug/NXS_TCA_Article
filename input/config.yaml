workers: 8
sample_size: 10000

# Zotero group libraries the corpus is built from. Each assessment becomes
# its own hive-partitioned sub-corpus (assessment=<label>) under
# output/NXS_TCA_corpus/corpus/. TCA is a public group (no auth needed);
# NXS is private and needs a Zotero API key with group access, stored in
# the system keyring under the entry below.
zotero:
  assessments:
    tca:
      id: 4589462
      description: "IPBES TCA assessment Zotero group (public)"
    nxs:
      id: 4596166
      description: "IPBES NXS assessment literature Zotero group (private)"
  api_key_keyring: API_zotero_all_groups

embeddings:
  # Which entry under configs: is active for this pipeline run. The active
  # name is also used as the `config=` hive-partition value under
  # output/NXS_TCA_corpus/embeddings/, so different models live side-by-side
  # on disk.
  active: SPECTER2_runpod

  configs:
    SPECTER2:
      # TEI server (start via ./scripts/start_tei_specter2.sh)
      host: localhost
      port: 8080
      scheme: http               # http for local, https for RunPod
      # auth_token_keyring: API_TEI   # OPTIONAL keyring entry → OVC_API_TOKEN (RunPod)
      model: allenai/specter2_proximity_merged   # provenance label (TEI --served-model-name)
      # Embedding-side tuning
      batch_size: 5000           # rows per shard (Arrow scan + parquet write)
      max_batch_size: 64        # texts per HTTP request to TEI (needs matching --max-client-batch-size 128 on TEI)
      concurrency: 1             # parallel in-flight HTTP requests; 1 = serial (local Metal default)
      # Text format
      sep_token: "[SEP]"
      title_cap_combined: 200    # char cap on title in `title [SEP] abstract` variant
      # Pilot
      pilot_n: 1000              # rows in the shared pilot subset (1000); null = full corpus
      # TEI server flags (read by scripts/start_tei_specter2.sh)
      max_batch_tokens: 32768
      max_concurrent: 512

    # RunPod-hosted TEI on a rented L40s/A100/H100. Flip embeddings.active above and
    # populate host/auth before use. See scripts/start_tei_runpod.sh.
    SPECTER2_runpod:
      host: pof6hmf5q6dfrk-8080.proxy.runpod.net
      port: 443
      scheme: https
      # auth_token_keyring: API_TEI   # keyring::key_set("API_TEI") first
      model: allenai/specter2_proximity_merged
      batch_size: 7168
      max_batch_size: 256        # bigger client batch amortises ~30ms RTT
      concurrency: 14             # parallel in-flight HTTP requests — saturates the L40S via dynamic batching
      sep_token: "[SEP]"
      title_cap_combined: 200
      pilot_n: null
      # TEI-server-side flags (read by scripts/start_tei_runpod.sh on the pod):
      max_batch_tokens: 131072
      max_concurrent: 2048

    # Template for adding more models — uncomment, fill in, set embeddings.active above.
    # NomicV1:
    #   host: localhost
    #   port: 8081
    #   model: nomic-ai/nomic-embed-text-v1.5
    #   batch_size: 5000
    #   max_batch_size: 64
    #   sep_token: ""             # Nomic uses raw concat, no special separator
    #   title_cap_combined: null  # 8192-ctx model — no need to cap title
    #   pilot_n: 1000
    #   max_batch_tokens: 65536
    #   max_concurrent: 512

# Cloudflare R2 (S3-compatible object storage). The BERTopic RunPod path
# reads embeddings directly from R2 via duckdb httpfs — no rsync upload.
# Credentials live in keyring (laptop) and RunPod Secrets (pod); only the
# non-secret addressing lives here.
#
# Path mapping: any local path under `embeddings_local_root` is translated
# to s3://<bucket>/<embeddings_remote_prefix>/<relative-from-local-root>
# by R/run_bertopic_runpod.R.
r2:
  endpoint:                26e6e95ff86cfcd155724000d2cdfbba.r2.cloudflarestorage.com
  bucket:                  nxs-tca-article
  region:                  auto
  embeddings_local_root:   output/NXS_TCA_corpus/embeddings
  embeddings_remote_prefix: embeddings
  # Credentials never live here.
  #   - emb_keypapers_r2_synced (sync_keypaper_embeddings_to_r2()) reads them
  #     fresh from the system keyring on every run: R2_ACCESS_KEY, R2_SECRET_KEY.
  #   - scripts/runpod/sync_embeddings_to_r2.sh (manual full-sync utility)
  #     instead uses rclone's own pre-configured `r2:` remote.
  #   - The pod gets them as RunPod Secrets (template env vars):
  #     R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.

# NEW: dual-path BERTopic. Each named entry under `configs:` produces its
# own (config, bertopic, variant) leaf under output/NXS_TCA_corpus/topics/,
# so multiple runs coexist on disk for comparison. Add entries by appending
# under `configs:` and pointing one of the `active_*` keys at the new name.
bertopic:
  active_local:   ~                    # which entry drives topics_local, ~ for disabled
  active_runpod:  runpod_v6_chapters            # which entry drives topics_runpod
  active_for_viz: runpod_v5_supervised            # which run feeds viz_topics_* in the report

  configs:
    default_local:
      method: local
      sample_size: 200000              # rows to fit BERTopic on; transfer the rest
      umap_n_components: 5
      umap_n_neighbors:  15
      umap_min_dist:     0.0
      umap_metric:       cosine
      hdbscan_min_cluster_size: 15
      hdbscan_min_samples:      3
      top_n_words:        15
      keypaper_threshold:  3
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    default_runpod:
      method: runpod
      # SSH transport to the RunPod bertopic-runpod pod
      ssh_host:        38.128.233.55
      ssh_port:        41340
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      # BERTopic knobs scaled for full-corpus fit (~4.6M title_abstract rows
      # + 105 keypapers). See TD_BERTopic.md for the reasoning behind each
      # value.
      umap_n_components: 5
      umap_n_neighbors:  30                  # full-corpus density supports larger neighbourhood
      umap_min_dist:     0.0
      umap_metric:       cosine
      # 500 ≈ 0.01% of corpus → expect ~200–500 topics. Tune up if too many
      # micro-topics, tune down if signal is too coarse.
      hdbscan_min_cluster_size: 500
      hdbscan_min_samples:       50
      top_n_words:         15
      keypaper_threshold:   3                # 105 keypapers spread over ~200–500 topics
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2            # per-topic concat doc, not per-corpus doc
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    # Retune round 1 — drop HDBSCAN min_cluster_size + min_samples to break
    # the default_runpod collapse (6 topics, topic 3 absorbed ~99% of the
    # corpus). UMAP params identical to default_runpod, so the UMAP stage
    # cache on R2 hits-and-skips; only HDBSCAN + c-TF-IDF + fallback re-run.
    # Expected outcome: ~200–500 topics, several relevant.
    runpod_v2:
      method: runpod
      # SSH transport — same pod as default_runpod; update on dispatch.
      ssh_host:        64.247.206.80
      ssh_port:        32312
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      # UMAP — identical to default_runpod so the R2 UMAP stage cache hits.
      umap_n_components: 5
      umap_n_neighbors:  30
      umap_min_dist:     0.0
      umap_metric:       cosine
      # HDBSCAN — bumped down. 500/50 collapsed; try 100/10 → expect
      # ~200–500 topics. Iterate further if still off.
      hdbscan_min_cluster_size: 100
      hdbscan_min_samples:       10
      top_n_words:         15
      keypaper_threshold:   3
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    # Retune round 2 — add corpus mean-centring before UMAP. Both
    # default_runpod and runpod_v2 collapsed to ~6–7 topics because all
    # pairwise cosine similarities in the corpus sit between 0.66–0.98
    # (median 0.80): SPECTER2 embeddings for a semantically tight filtered
    # corpus cluster in a narrow cone. Subtracting the corpus mean shifts
    # the points from that cone to a ball centred on the origin, giving
    # UMAP a real k-NN distance structure to work with.
    # UMAP params unchanged from runpod_v2 but center_embeddings=true
    # produces a new umap_hash → fresh R2 UMAP cache slot, no collision.
    # HDBSCAN left at 100/10 from runpod_v2; revisit if the centred UMAP
    # still collapses.
    runpod_v3:
      method: runpod
      # SSH transport — update ssh_host/ssh_port on each new pod dispatch.
      ssh_host:        154.54.102.45
      ssh_port:        13820
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      center_embeddings: true          # subtract corpus mean before UMAP fit
      umap_n_components: 5
      umap_n_neighbors:  30
      umap_min_dist:     0.0
      umap_metric:       cosine
      hdbscan_min_cluster_size: 100
      hdbscan_min_samples:       10
      top_n_words:         15
      keypaper_threshold:   3
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    # Retune round 3 — PCA + whitening before UMAP.
    # Diagnosis: the corpus sits in a tight cosine cone (pairwise similarity
    # 0.66–0.98) but PCA shows genuine multi-dimensional structure: PC1
    # explains only 8% of variance (corpus sample) / 10.8% (keypapers),
    # and 100 PCs capture ~86% / 99.8% respectively. Mean-centring alone
    # (runpod_v3) was insufficient; PCA + whitening decorrelates the
    # dimensions AND rescales them to equal variance, giving UMAP a truly
    # isotropic input space.
    # Metric switches to euclidean (appropriate for whitened PCA output).
    # n_neighbors lowered to 15 (PCA space is cleaner; 30 is for raw embeddings).
    runpod_v4:
      method: runpod
      # SSH transport — update ssh_host/ssh_port on each new pod dispatch.
      ssh_host:        64.247.206.221
      ssh_port:        12789
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      # PCA preprocessing
      pca_n_components:  100           # keeps ~86% corpus variance / ~99.8% keypaper variance
      pca_whiten:        true          # rescale PCs to unit variance (isotropic input for UMAP)
      pca_sample_size:   500000        # rows to fit PCA on; transforms full corpus after
      # UMAP on PCA-whitened space
      umap_n_components: 5
      umap_n_neighbors:  15            # lower than v3: PCA space has real local structure
      umap_min_dist:     0.0
      umap_metric:       euclidean     # euclidean on whitened PCA (cosine less meaningful here)
      hdbscan_min_cluster_size: 100
      hdbscan_min_samples:       10
      top_n_words:         15
      keypaper_threshold:   3
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13


    # Supervised UMAP — concept-anchored clustering.
    # The unsupervised fits (v2–v4) collapsed to one blob (pairwise cosine
    # 0.66–0.98). Here each corpus work gets a class label = its NEAREST
    # concept definition: argmax cosine to the concept/keypaper SPECTER2
    # embeddings (the key_works set), computed on the pod from the RAW vectors
    # — the same space as the keypaper scores — before any PCA/centring.
    # Works whose best cosine is below `supervised_min_similarity` stay
    # unlabelled (y = -1) and are placed by embedding geometry alone. cuml UMAP
    # then fits with target_metric=categorical + target_weight, pulling each
    # work toward its concept's region instead of collapsing into one cone.
    # Corpus embeddings reused from earlier configs; UMAP/HDBSCAN/c-TF-IDF all
    # rerun (the supervised knobs are part of umap_hash). Tuning knobs:
    #   target_weight             0 = ignore labels … 1 = labels dominate.
    #   supervised_min_similarity raise to leave weakly-related works unlabelled.
    runpod_v5_supervised:
      method: runpod
      ssh_host:        91.199.227.82   # update on each new pod dispatch
      ssh_port:        16089
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work

      # Supervised UMAP — each work labelled by its nearest concept (on-pod,
      # from the key_works concept embeddings; no external label file needed).
      supervised_umap:    true
      target_metric:      categorical
      target_weight:      1          # 0 = fully unsupervised, 1 = fully label-driven; tune
      supervised_min_similarity: 0.0 # min cosine to nearest concept; below this -> unlabelled (-1)

      # Raw cosine on SPECTER2 embeddings (no PCA — supervised signal
      # provides the structure that PCA+whitening was trying to manufacture)
      umap_n_components:  5
      umap_n_neighbors:   15
      umap_min_dist:      0.0
      umap_metric:        cosine

      # With 40 concept anchors expect ~40–80 meaningful clusters;
      # raise min_cluster_size vs v4 since structure should be cleaner
      hdbscan_min_cluster_size: 100
      hdbscan_min_samples:       50

      top_n_words:         15
      keypaper_threshold:   1       # each concept keypaper should land in a topic
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

    # Unsupervised, scaled for THIS corpus (~6,856 chapter-tagged works, not
    # the 5.7M-row TCAC corpus the v2–v4 knobs were tuned for). v4's
    # min_cluster_size=100 collapsed everything into 2 topics, which then
    # crashed c-TF-IDF (max_df < min_df on 2 docs). PCA + UMAP params are
    # IDENTICAL to runpod_v4, so the UMAP R2 stage-cache hits and only
    # HDBSCAN + c-TF-IDF + fallback re-run. Only the HDBSCAN sizes shrink.
    # NOTE: this corpus is homogeneous (one assessment) — if this still
    # under-separates, use runpod_v5_supervised (concept-anchored).
    runpod_v6_chapters:
      method: runpod
      ssh_host:        91.199.227.82   # update on each new pod dispatch
      ssh_port:        16089
      ssh_user:        root
      ssh_key_path:    ~/.ssh/id_ed25519
      remote_workdir:  /work
      # --- PCA + UMAP identical to runpod_v4 (keeps umap_hash → cache hit) ---
      pca_n_components:  100
      pca_whiten:        true
      pca_sample_size:   500000
      umap_n_components: 5
      umap_n_neighbors:  15
      umap_min_dist:     0.0
      umap_metric:       euclidean
      # --- HDBSCAN scaled down for ~7k works (was 100/10 in v4) -------------
      hdbscan_min_cluster_size: 25
      hdbscan_min_samples:       5
      top_n_words:         15
      keypaper_threshold:   1
      primary_variant:    title_abstract
      fallback_variant:   title
      vectorizer_min_df:        2
      vectorizer_max_df:        0.95
      vectorizer_max_features:  20000
      vectorizer_ngram:        [1, 2]
      random_seed: 13

# Visualisation layer. Knobs for the report-side figures only.
# Edits here do not invalidate any data/embedding/scoring/topics target —
# only the viz/fig_* layer downstream of viz_umap_*.
viz:
  # uwot::umap fit on the laptop for the report's 2D scatter background.
  # The full corpus (~5.77M × 768) won't fit in RAM and would take days, so
  # we fit on a sample and project nothing beyond it. All keypapers are
  # always included unsampled.
  umap_sample_size: 1000        # rows sampled from the corpus
  umap_n_neighbors: 15
  umap_min_dist:    0.1
  umap_metric:      cosine
  umap_seed:        13

